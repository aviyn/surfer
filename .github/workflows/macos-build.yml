name: macOS build

on:
  push:
    branches: [anti-aliasing-toggle]
  workflow_dispatch:

jobs:
  macos-aarch64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --features accesskit
      - name: Package
        run: |
          mkdir dist
          cp target/release/surfer target/release/surver dist/
          cd dist && zip ../surfer_macos-aarch64.zip surfer surver
      - uses: actions/upload-artifact@v4
        with:
          name: surfer_macos-aarch64
          path: surfer_macos-aarch64.zip
          retention-days: 14
